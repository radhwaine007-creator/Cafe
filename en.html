<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Takings</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6f6b63;--bd:#e2ded4;--ac:#2f6b4f;--act:#fff;--bad:#b3392b;--ok:#2f6b4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#222420;--tx:#eeeae0;--mut:#a09b8f;--bd:#34362f;--ac:#5fb58a;--act:#10241a;--bad:#ef8b7c;--ok:#5fb58a}}
:root[data-theme="dark"]{--bg:#171815;--card:#222420;--tx:#eeeae0;--mut:#a09b8f;--bd:#34362f;--ac:#5fb58a;--act:#10241a;--bad:#ef8b7c;--ok:#5fb58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}
.row .n{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input.num{width:78px;text-align:center}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--act);font:inherit;font-weight:700}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--bad);color:#fff}
.big{width:52px;height:52px;font-size:26px;padding:0}
.cnt{min-width:40px;text-align:center;font-size:22px;font-weight:700}
.sum{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
.sum:last-child{border:0}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{font-size:22px;font-weight:800}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:400px}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:center}
td:first-child,th:first-child{text-align:left}
</style>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2f6b4f"></head>
<body>
<div class="wrap">
<div class="row" style="justify-content:space-between"><h1>☕ Café Takings</h1><button class="btn r" onclick="resetAll(this)">↺ Reset</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
var S;var TAB="sell";var armed=0;
var TABS=[["prod","Products"],["start","Start"],["sell","Sales"],["end","End"],["sum","Summary"]];
function uid(){return Math.random().toString(36).slice(2,9)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fresh(){return{name:"",date:today(),time:"",dep:0,p:[]}}
function load(){try{var r=localStorage.getItem("recette-cafe-en");if(r){S=JSON.parse(r);return}}catch(e){}S=fresh()}
function save(){try{localStorage.setItem("recette-cafe-en",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return (Math.round(n*1000)/1000)+" DT"}
function num(v){var x=parseFloat(v);return isNaN(x)?0:x}
function find(id){return S.p.filter(function(x){return x.id===id})[0]}
function sure(el,txt){if(armed){clearTimeout(armed);armed=0;el.textContent=el.dataset.o;return true}el.dataset.o=el.textContent;el.textContent=txt;armed=setTimeout(function(){armed=0;el.textContent=el.dataset.o},4000);return false}
function tabs(){document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===TAB?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")}
function go(t){TAB=t;render()}
function render(){tabs();var v=document.getElementById("view");v.innerHTML=({prod:vProd,start:vStart,sell:vSell,end:vEnd,sum:vSum})[TAB]()}
function setF(k,v){S[k]=k==="dep"?num(v):v;save()}
function setP(id,k,v){var p=find(id);p[k]=(k==="name")?v:(k==="price"?num(v):v);save()}
function addForm(){return '<div class="card"><b>+ New product</b><input id="nn" placeholder="Name (e.g. Express)" style="margin:8px 0"><div class="row"><input id="np" type="number" step="0.001" inputmode="decimal" placeholder="Price (DT)"><input id="ns" type="number" inputmode="numeric" placeholder="Start qty"><button class="btn" onclick="add()">Add</button></div></div>'}
function empty(){return '<div class="card mut">No products yet. Go to the "Products" or "Start" tab and add yours.</div>'}
function add(){var n=document.getElementById("nn").value.trim();if(!n)return;S.p.push({id:uid(),name:n,price:num(document.getElementById("np").value),start:document.getElementById("ns").value,end:"",sold:0});save();render()}
function del(id,el){if(sure(el,"Delete?")){S.p=S.p.filter(function(x){return x.id!==id});save();render()}}

function vProd(){
 return '<div class="card"><b>Products &amp; prices</b><div class="mut">Add your own products (name + price in dinars + start quantity), e.g. price 1.500. You can edit or delete them anytime.</div></div>'+(S.p.length?'':'<div class="card mut">No products yet. Add your first one below 👇</div>')+
 S.p.map(function(p){return '<div class="card row"><input style="flex:1" value="'+esc(p.name)+'" onchange="setP(\''+p.id+'\',\'name\',this.value)"><input class="num" type="number" step="0.001" inputmode="decimal" value="'+p.price+'" onchange="setP(\''+p.id+'\',\'price\',this.value)"><button class="btn g" onclick="del(\''+p.id+'\',this)">✕</button></div>'}).join("")+
 addForm()}
function head(){return '<div class="card grid"><div><div class="mut">Name</div><input value="'+esc(S.name)+'" onchange="setF(\'name\',this.value)"></div><div><div class="mut">Date</div><input type="date" value="'+S.date+'" onchange="setF(\'date\',this.value)"></div></div>'}
function vStart(){
 return head()+'<div class="card"><b>Start-of-shift count</b><div class="mut">Count the products you want to track (Eau, Canette, Cake, Gateaux, Tiramisu, Gobelet...) one by one. Leave the others empty.</div></div>'+
 S.p.map(function(p){return '<div class="card row"><div class="n"><b>'+esc(p.name)+'</b></div><input class="num" type="number" inputmode="numeric" value="'+p.start+'" onchange="setP(\''+p.id+'\',\'start\',this.value)"></div>'}).join("")+addForm()}
function vEnd(){
 if(!S.p.length)return empty();
 return '<div class="card"><b>End-of-shift count</b><div class="mut">Count what is left. Under each product you will see what was used and the difference.</div></div>'+
 S.p.map(function(p){var c=num(p.start)-num(p.end),d=c-p.sold,hasE=p.end!==""&&p.start!=="";
  var info=hasE?'Used: <b>'+c+'</b> · Sales logged: <b>'+p.sold+'</b> · <span class="'+(d===0?"ok":"bad")+'">'+(d===0?"Match ✓":(d>0?"Unlogged: "+d:"Extra: "+(-d)))+'</span>':'';
  return '<div class="card"><div class="row"><div class="n"><b>'+esc(p.name)+'</b><div class="mut">Start: '+(p.start===""?"—":p.start)+'</div></div><input class="num" type="number" inputmode="numeric" value="'+p.end+'" onchange="setP(\''+p.id+'\',\'end\',this.value);render()"></div>'+(info?'<div class="mut" style="margin-top:6px">'+info+'</div>':'')+'</div>'}).join("")}
function vSell(){
 if(!S.p.length)return empty();
 var tot=S.p.reduce(function(a,p){return a+p.sold*p.price},0);
 return '<div class="card"><div class="mut">Total sales</div><div class="tot" id="tt">'+fmt(tot)+'</div></div>'+
 S.p.map(function(p){return '<div class="card row"><div class="n"><b>'+esc(p.name)+'</b><div class="mut">'+fmt(p.price)+' · <span id="m'+p.id+'">'+fmt(p.sold*p.price)+'</span></div></div><button class="btn g big" onclick="chg(\''+p.id+'\',-1)">−</button><div class="cnt" id="c'+p.id+'">'+p.sold+'</div><button class="btn big" onclick="chg(\''+p.id+'\',1)">+</button></div>'}).join("")}
function chg(id,d){var p=find(id);p.sold=Math.max(0,p.sold+d);save();document.getElementById("c"+id).textContent=p.sold;document.getElementById("m"+id).textContent=fmt(p.sold*p.price);document.getElementById("tt").textContent=fmt(S.p.reduce(function(a,x){return a+x.sold*x.price},0))}

function calc(){var sales=0,cons=0,lost=0;S.p.forEach(function(p){sales+=p.sold*p.price;if(p.start!==""&&p.end!==""){var c=num(p.start)-num(p.end);cons+=c*p.price;lost+=(c-p.sold)*p.price}});return{sales:sales,cons:cons,lost:lost}}
function vSum(){
 var c=calc();
 var rows=S.p.filter(function(p){return p.sold||p.start!==""||p.end!==""}).map(function(p){var has=p.start!==""&&p.end!=="",u=num(p.start)-num(p.end),d=u-p.sold;return '<tr><td>'+esc(p.name)+'</td><td>'+(p.start===""?"—":p.start)+'</td><td>'+(p.end===""?"—":p.end)+'</td><td>'+(has?u:"—")+'</td><td>'+p.sold+'</td><td class="'+(has?(d===0?"ok":"bad"):"")+'">'+(has?(d>0?"-"+d:(d<0?"+"+(-d):"✓")):"—")+'</td></tr>'}).join("");
 return head()+'<div class="card"><div class="mut">Time</div><input type="time" value="'+S.time+'" onchange="setF(\'time\',this.value)"></div>'+
 '<div class="card"><div class="sum"><span>Total sales (all)</span><b>'+fmt(c.sales)+'</b></div><div class="sum"><span>Value used (from counts)</span><b>'+fmt(c.cons)+'</b></div><div class="sum"><span>Difference</span><b class="'+(Math.abs(c.lost)<0.0005?"ok":"bad")+'">'+(c.lost>0?"Short "+fmt(c.lost):(c.lost<0?"Extra "+fmt(-c.lost):"Match ✓"))+'</b></div>'+
 '<div class="sum"><span>Expenses</span><input class="num" style="width:110px" type="number" step="0.001" inputmode="decimal" value="'+S.dep+'" onchange="setF(\'dep\',this.value);render()"></div>'+
 '<div class="sum"><span>Net (sales − expenses)</span><b class="tot">'+fmt(c.sales-S.dep)+'</b></div></div>'+
 '<div class="card scroll"><table><tr><th>Product</th><th>Start</th><th>End</th><th>Used</th><th>Sold</th><th>Diff</th></tr>'+rows+'</table><div class="mut" style="margin-top:6px">Diff "-" = used more than what was logged.</div></div>'+
 '<div class="row"><button class="btn" style="flex:1" onclick="copyS()">Copy summary</button><button class="btn r" onclick="newShift(this)">New shift</button></div><div id="msg" class="mut" style="margin-top:8px"></div>'}
function copyS(){var c=calc(),t="Takings "+S.date+" "+S.time+" "+S.name+"\n";S.p.forEach(function(p){if(p.sold)t+=p.name+": "+p.sold+" x "+p.price+" = "+(p.sold*p.price)+"\n"});t+="Total: "+c.sales+"\nExpenses: "+S.dep+"\nNet: "+(c.sales-S.dep)+"\nCount difference: "+c.lost;
 var m=document.getElementById("msg");try{navigator.clipboard.writeText(t).then(function(){m.textContent="Copied ✓"},function(){m.textContent="Could not copy"})}catch(e){m.textContent="Could not copy"}}
function clearNums(){S.p.forEach(function(p){p.start="";p.end="";p.sold=0});S.dep=0;S.time="";S.date=today();save()}
function newShift(el){if(!sure(el,"Tap again to confirm"))return;clearNums();TAB="start";render()}
function resetAll(el){if(!sure(el,"Tap again to confirm"))return;clearNums();render()}
load();render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
</script>
</body>
</html>
